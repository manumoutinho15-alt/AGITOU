
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGITOU | Seu fim de semana começa aqui</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:28px 20px;background:#111a32;text-align:center}
.logo{font-size:34px;font-weight:900;letter-spacing:3px;color:#70aaff}
header p{color:#c4d1e8}
main{max-width:850px;margin:auto;padding:20px}
h2{margin-top:28px}
.search{width:100%;padding:16px;border:1px solid #344565;border-radius:12px;background:#17233d;color:white;font-size:16px}
.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}
.tabs button,.filters button{background:#1b2945;color:white;border:0;padding:12px 16px;border-radius:10px}
button.active{background:#5594ff;color:white}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.card{background:#15213a;border:1px solid #293957;border-radius:16px;padding:20px;margin:14px 0}
.card h3{margin:0 0 8px;color:#8eb9ff}
.info{color:#bdc9dc;font-size:14px}
.card button{background:#5594ff;border:0;color:white;padding:12px 18px;border-radius:10px;font-weight:bold;margin-top:12px}
.card button:disabled{background:#3b506f}
footer{text-align:center;color:#8493ad;padding:30px}
</style>
</head>
<body>
<header>
<div class="logo">AGITOU.</div>
<p>Seu fim de semana começa aqui!</p>
</header>
<main>
<h2>Onde vamos hoje?</h2>
<input class="search" id="search" placeholder="🔎 Procure por cidade ou evento..." oninput="render()">
<div class="tabs">
<button class="active" onclick="day('Todos',this)">Todos</button>
<button onclick="day('Sexta',this)">Sexta</button>
<button onclick="day('Sábado',this)">Sábado</button>
<button onclick="day('Domingo',this)">Domingo</button>
</div>
<div class="filters">
<button class="active" onclick="category('Todos',this)">Todos</button>
<button onclick="category('Festa',this)">🎉 Festas</button>
<button onclick="category('Show',this)">🎤 Shows</button>
<button onclick="category('Passeio',this)">🌴 Passeios</button>
</div>
<h2>🔥 Descubra os rolês</h2>
<div id="events"></div>
</main>
<footer>AGITOU © 2026 · Seu próximo rolê começa aqui.</footer>
<script>
const events=[
{day:'Sexta',type:'Festa',name:'Noite de Festa',place:'Rio de Janeiro',time:'20h',desc:'Uma noite para curtir com os amigos.'},
{day:'Sábado',type:'Show',name:'Sábado Musical',place:'Rio de Janeiro',time:'19h',desc:'Música boa e muita diversão.'},
{day:'Sábado',type:'Passeio',name:'Dia de Passeio',place:'Rio de Janeiro',time:'10h',desc:'Explore lugares incríveis.'},
{day:'Domingo',type:'Festa',name:'Domingo Animado',place:'Baixada Fluminense',time:'16h',desc:'Termine o fim de semana em grande estilo.'}
];
let selectedDay='Todos',selectedCategory='Todos',going=[];
function day(v,b){selectedDay=v;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function category(v,b){selectedCategory=v;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function join(i){if(going.includes(i))going=going.filter(x=>x!==i);else going.push(i);render()}
function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=events.map((e,i)=>({...e,i})).filter(e=>
(selectedDay==='Todos'||e.day===selectedDay)&&
(selectedCategory==='Todos'||e.type===selectedCategory)&&
(e.name+' '+e.place+' '+e.desc).toLowerCase().includes(q));
document.getElementById('events').innerHTML=list.length?list.map(e=>`
<div class="card">
<h3>${e.name}</h3>
<div class="info">📅 ${e.day} · 🕒 ${e.time} · 📍 ${e.place}</div>
<p>${e.desc}</p>
<div class="info">${e.type}</div>
<button onclick="join(${e.i})">${going.includes(e.i)?'✓ Eu vou!':'Eu vou!'}</button>
</div>`).join(''):'<p>Nenhum evento encontrado. Tente outra busca!</p>';
}
render();
</script>
</body>
</html>
